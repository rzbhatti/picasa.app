; supervisord runs as ROOT (so it can forward child logs to the container's
; stdout at /dev/stdout -> visible via `docker logs picasa`). Each managed
; program drops to the unprivileged app user via `user=`. Runtime state lives
; under /tmp (always writable).
[supervisord]
nodaemon=true
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid
loglevel=info

[unix_http_server]
file=/tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; --- 1. Virtual X server -----------------------------------------------------
[program:xvfb]
priority=10
command=/usr/bin/Xvfb :0 -screen 0 %(ENV_DISPLAY_WIDTH)sx%(ENV_DISPLAY_HEIGHT)sx24 -ac +extension GLX +render -noreset
user=%(ENV_APP_USERNAME)s
environment=HOME="/config"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- 2. Window manager -------------------------------------------------------
[program:openbox]
priority=20
command=/usr/bin/openbox
user=%(ENV_APP_USERNAME)s
environment=HOME="/config",DISPLAY=":0"
autorestart=true
startsecs=2
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- 3. VNC server bound to loopback only ------------------------------------
[program:x11vnc]
priority=30
command=/usr/bin/x11vnc -display :0 -rfbport 5900 -localhost -forever -shared -nopw -wait 50 -noxdamage
user=%(ENV_APP_USERNAME)s
environment=HOME="/config",DISPLAY=":0"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- 4. noVNC -> browser on :5800 --------------------------------------------
[program:novnc]
priority=40
command=/usr/bin/websockify --web=/usr/share/novnc 5800 localhost:5900
user=%(ENV_APP_USERNAME)s
environment=HOME="/config"
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; --- 5. Picasa under Wine ----------------------------------------------------
[program:picasa]
priority=50
command=/startapp.sh
user=%(ENV_APP_USERNAME)s
environment=HOME="/config",DISPLAY=":0"
autorestart=true
startretries=999
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
